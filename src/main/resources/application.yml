# =================================================================
# Spring Boot 기본 설정
# =================================================================
spring:
  application:
    name: unibooker

  # =================================================================
  # 데이터베이스 설정
  # =================================================================
  datasource:
    url: ${DB_URL}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # SQL 초기화 설정
  sql:
    init:
      mode: always

  # =================================================================
  # JPA/Hibernate 설정
  # =================================================================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_OPTION}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  # =================================================================
  # 이메일 설정 (Gmail SMTP) - 여기로 이동!
  # =================================================================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          auth: true
          timeout: 5000

  # =================================================================
  # Thymeleaf 설정
  # =================================================================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # 개발: false, 프로덕션: true

  # =================================================================
  # AWS 클라우드 설정 (S3)
  # =================================================================
  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        bucket: ${MY_BUCKET}
      region:
        static: ${AWS_REGION}

  # =================================================================
  # Redis 설정 (Upstash)
  # =================================================================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  # =================================================================
  # Spring Batch 자동 실행 방지 설정
  # =================================================================
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

# =================================================================
# 파일 업로드 설정
# =================================================================
file:
  upload:
    path: uploads/
    company-logo-path: company/logos/
    max-size: 5242880

# =================================================================
# AWS 클라우드 설정 (S3)
# =================================================================
cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    s3:
      bucket: ${MY_BUCKET}
    region:
      static: ${AWS_REGION}

# =================================================================
# Swagger (SpringDoc) 설정
# =================================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    operations-sorter: alpha
    tags-sorter: alpha

# =================================================================
# JWT 토큰 설정
# =================================================================
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 86400000       # 1일 (24 * 60 * 60 * 1000)
  refresh-token-validity: 604800000   # 7일 (7 * 24 * 60 * 60 * 1000)

# =================================================================
# OAuth 설정
# =================================================================
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

# =================================================================
# 프론트엔드 URL 설정
# =================================================================
front:
  base-url: ${FRONT_BASE_URL}

# =================================================================
# 앱 설정
# =================================================================
app:
  mail:
    from: noreply@unibooker.com
    login-url: https://unibooker.com/login

  # ========== 배치 처리 설정 ==========
  batch:
    # 전역 배치 활성화 플래그
    enabled: true

    # 미활성 계정 정리 (2주마다)
    inactive-minutes: 4320              # 72시간 (3일)
    inactive-account:
      cron: "0 0 2 1,15 * ?"           # 매달 1일, 15일 새벽 2시 (약 2주)

    # 거절된 기업 정리 (2주마다)
    company-retention-days: 7           # 보존 기간 (일)
    rejected-company:
      cron: "0 0 2 1,15 * ?"           # 매달 1일, 15일 새벽 2시 (약 2주)

# =================================================================
# 서버 설정
# =================================================================
server:
  servlet:
    session:
      cookie:
        same-site: strict
        secure: false  # 개발: false, 운영: true (HTTPS 필수)
        http-only: true

# =================================================================
# 톰캣 설정
# =================================================================
  tomcat:
    max-threads: 10
    accept-count: 5
    connection-timeout: 60000


# =================================================================
# Actuator
# =================================================================
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      enabled: true
  health:
    mail:
      enabled: false
    diskspace:
      enabled: false

# =================================================================
# TTL 설정 (초 단위)
# =================================================================
ttl:
  queue:
    wait: 10        # 대기 토큰 TTL (Polling마다 갱신)
    enter: 60      # 입장 토큰 TTL (예약 페이지 제한 시간)
  hold: 30         # Hold TTL (시간/좌석 임시 점유)
