<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>예약 취소 안내</title>
</head>
<body style="font-family: 'Noto Sans KR', Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
<div style="background-color: #f8f9fa; padding: 30px; border-radius: 10px;">
    <h1 style="color: #00008C; margin-bottom: 20px;">예약 취소 안내</h1>

    <p>안녕하세요, <strong th:text="${name}">고객</strong>님.</p>

    <p>예약하신 <strong th:text="${resourceName}">서비스</strong>이(가) 관리자에 의해 취소되었습니다.</p>

    <div style="background-color: #fff; padding: 20px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #dc3545;">
        <h3 style="margin-top: 0; color: #dc3545;">■ 예약 정보</h3>
        <p th:text="${reservationInfo}" style="white-space: pre-line;">예약 정보</p>
    </div>

    <p style="color: #666;">문의사항은 관리자에게 연락 바랍니다.</p>

    <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">

    <p style="font-size: 12px; color: #999;">
        본 메일은 발신 전용입니다.<br>
        © UniBooker. All rights reserved.
    </p>
</div>
</body>
</html>
