<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 리마인더</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header .logo { font-size: 48px; margin-bottom: 10px; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 600; }
        .content { padding: 40px 30px; }
        .greeting {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .content p { margin-bottom: 15px; color: #555; line-height: 1.8; }
        .reminder-box {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-left: 4px solid #fd7e14;
            padding: 25px;
            margin: 30px 0;
            border-radius: 8px;
            text-align: center;
        }
        .reminder-box .icon { font-size: 48px; margin-bottom: 10px; }
        .reminder-box .title {
            font-size: 22px;
            font-weight: bold;
            color: #856404;
            margin-bottom: 10px;
        }
        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 25px 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #666; font-weight: 500; }
        .info-value { color: #333; font-weight: 600; }
        .footer {
            background: #f8f9fa;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }
        .footer .contact p { margin: 5px 0; color: #666; font-size: 14px; }
        .footer .copyright {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <div class="logo">⏰</div>
        <h1>UniBooker</h1>
    </div>
    <div class="content">
        <div class="greeting">
            안녕하세요, <strong th:text="${name}">홍길동</strong>님
        </div>
        <div class="reminder-box">
            <div class="icon">📅</div>
            <div class="title" th:text="${reminderType == '1H'} ? '예약 1시간 전입니다!' : '예약 24시간 전입니다!'">예약 리마인더</div>
        </div>
        <p>예약하신 일정이 곧 시작됩니다. 아래 내용을 확인해주세요.</p>
        <div class="info-box">
            <div class="info-row">
                <span class="info-label">예약 항목</span>
                <span class="info-value" th:text="${resourceName}">회의실 A</span>
            </div>
            <div class="info-row">
                <span class="info-label">예약 일시</span>
                <span class="info-value" th:text="${dateTime}">01월 15일 14:00</span>
            </div>
        </div>
        <p>시간에 맞춰 방문해주시기 바랍니다. 감사합니다.</p>
    </div>
    <div class="footer">
        <div class="contact">
            <p><strong>문의사항이 있으신가요?</strong></p>
            <p>📧 이메일: support@unibooker.com</p>
            <p>📞 전화: 1234-5678</p>
        </div>
        <div class="copyright">© 2025 UniBooker. All rights reserved.</div>
    </div>
</div>
</body>
</html>
