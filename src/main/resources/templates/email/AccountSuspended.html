<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계정 정지 안내</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header .logo { font-size: 48px; margin-bottom: 10px; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 600; }
        .content { padding: 40px 30px; }
        .greeting {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .content p { margin-bottom: 15px; color: #555; line-height: 1.8; }
        .suspended-box {
            background: #ffe5e5;
            border-left: 4px solid #dc3545;
            padding: 25px;
            margin: 30px 0;
            border-radius: 8px;
            text-align: center;
        }
        .suspended-box .icon { font-size: 48px; margin-bottom: 10px; }
        .suspended-box .title {
            font-size: 22px;
            font-weight: bold;
            color: #721c24;
            margin-bottom: 10px;
        }
        .suspended-box .message { font-size: 16px; color: #721c24; }
        .reason-box {
            background: #f8f9fa;
            border-left: 4px solid #6c757d;
            padding: 20px;
            margin: 25px 0;
            border-radius: 8px;
        }
        .reason-box .label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .reason-box .reason {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        .footer {
            background: #f8f9fa;
            padding: 30px;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }
        .footer .contact p { margin: 5px 0; color: #666; font-size: 14px; }
        .footer .copyright {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <div class="logo">🚫</div>
        <h1>UniBooker</h1>
    </div>
    <div class="content">
        <div class="greeting">
            안녕하세요, <strong th:text="${name}">홍길동</strong>님
        </div>
        <div class="suspended-box">
            <div class="icon">⚠️</div>
            <div class="title">계정이 정지되었습니다</div>
            <div class="message">
                <strong th:text="${companyName}">회사명</strong>의 계정이 관리자에 의해 정지되었습니다.
            </div>
        </div>
        <div class="reason-box">
            <div class="label">정지 사유</div>
            <div class="reason" th:text="${reason}">관리자에 의해 계정이 정지되었습니다.</div>
        </div>
        <p>계정 정지에 대한 문의사항이 있으시면 아래 연락처로 문의해주세요.</p>
    </div>
    <div class="footer">
        <div class="contact">
            <p><strong>문의사항이 있으신가요?</strong></p>
            <p>📧 이메일: support@unibooker.com</p>
            <p>📞 전화: 1234-5678</p>
        </div>
        <div class="copyright">© 2025 UniBooker. All rights reserved.</div>
    </div>
</div>
</body>
</html>
