name: 🚀 UniBooker 백엔드 배포

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  DOCKER_IMAGE: johnheo81/unibooker-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📢 배포 시작 알림
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚀 백엔드 배포 시작",
                "description": "UniBooker BE 배포가 시작되었습니다.",
                "color": 3447003,
                "fields": [
                  {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
                  {"name": "By", "value": "${{ github.actor }}", "inline": true}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: ☕ JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Gradle 캐시
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔨 Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 🐳 Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: 🚀 EC2 배포 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app

            # .env 파일 생성
            cat > .env << 'EOF'
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JPA_DDL_OPTION=${{ secrets.JPA_DDL_OPTION }}
            GMAIL_USERNAME=${{ secrets.GMAIL_USERNAME }}
            GMAIL_PASSWORD=${{ secrets.GMAIL_PASSWORD }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            MY_BUCKET=${{ secrets.MY_BUCKET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            REDIS_HOST=${{ secrets.REDIS_HOST }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

            # 기존 컨테이너 정리
            docker stop unibooker || true
            docker rm unibooker || true

            # 이전 이미지 및 캐시 정리
            docker system prune -af --volumes
            docker builder prune -af

            # Docker Hub에서 이미지 Pull
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # 컨테이너 실행
            docker run -d \
              --name unibooker \
              --env-file .env \
              -p 8080:8080 \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest

            # 헬스체크
            echo "⏳ 헬스체크 시작..."
            for i in {1..12}; do
              if curl -s http://localhost:8080/actuator/health | grep -q "UP"; then
                echo "✅ 서버 정상 구동!"
                exit 0
              fi
              echo "대기 중... ($i/12)"
              sleep 5
            done

            echo "❌ 헬스체크 실패"
            exit 1

      - name: ✅ 배포 성공 알림
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ 백엔드 배포 성공",
                "description": "UniBooker BE 배포가 완료되었습니다!",
                "color": 3066993,
                "fields": [
                  {"name": "환경", "value": "Production", "inline": true},
                  {"name": "이미지", "value": "${{ env.DOCKER_IMAGE }}:${{ github.sha }}", "inline": false}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: ❌ 배포 실패 알림
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ 백엔드 배포 실패",
                "description": "UniBooker BE 배포에 실패했습니다!",
                "color": 15158332,
                "fields": [
                  {"name": "로그 확인", "value": "[GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
                ]
              }]
            }' \
            ${{ secrets.DISCORD_WEBHOOK_URL }}